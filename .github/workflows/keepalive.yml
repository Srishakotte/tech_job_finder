# Keeps the free Render instance awake so Telegram replies and Instagram
# comment-to-DM respond instantly instead of after a ~50 s cold start.
# Render's free plan includes 750 instance hours/month: enough for one
# service running 24/7.
name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may delay a few minutes)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping /health
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 90 https://tech-job-finder-63u5.onrender.com/health || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "Render did not answer /health"
          exit 1
