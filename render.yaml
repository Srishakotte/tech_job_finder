services:
  - type: web
    name: jobhunter-instagram-webhook
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-webhook.txt
    startCommand: gunicorn instagram_webhook:application --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 30
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: jobhunter
      - key: INSTAGRAM_GRAPH_API_VERSION
        value: v25.0
      - key: INSTA_TOKEN
        sync: false
      - key: INSTAGRAM_USER_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: WEBHOOK_ADMIN_TOKEN
        sync: false
